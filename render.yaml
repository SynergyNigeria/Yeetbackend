services:
  - type: web
    name: yeet-bank-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "DJANGO_SETTINGS_MODULE=yeet_bank.settings daphne -b 0.0.0.0 -p $PORT yeet_bank.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
